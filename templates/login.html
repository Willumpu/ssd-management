{% extends "base.html" %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-950 bg-grid p-4">
    <div class="w-full max-w-md">
        <div class="glass rounded-2xl p-6 lg:p-8 border border-slate-700">
            <div class="text-center mb-6 lg:mb-8">
                <div class="w-14 h-14 lg:w-16 lg:h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                    <i class="fas fa-microchip text-white text-2xl lg:text-3xl"></i>
                </div>
                <h1 class="text-xl lg:text-2xl font-bold text-white">SSD FAE业务管理系统</h1>
                <p class="text-slate-400 mt-2 text-sm lg:text-base">请登录以继续</p>
            </div>

            <form method="post" class="space-y-4 lg:space-y-6">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm text-slate-400 mb-2">用户名</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" name="username" required
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors"
                               placeholder="请输入用户名">
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-2">密码</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" name="password" required
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors"
                               placeholder="请输入密码">
                    </div>
                </div>

                {% if form.errors %}
                <div class="p-3 rounded-lg bg-red-500/20 border border-red-500/30 text-red-400 text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    用户名或密码错误
                </div>
                {% endif %}

                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition-all shadow-lg shadow-blue-600/20">
                    登录
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
                <p>SSD Controller Marketing Platform v2.4.0</p>
                <p class="mt-1">© 2024 All Rights Reserved</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
