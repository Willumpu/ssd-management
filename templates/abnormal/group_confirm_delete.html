{% extends 'base.html' %}

{% block title %}删除异常样品组 - SSD FAE业务管理系统{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto animate-slide-in">
    <div class="glass rounded-xl p-6 border border-red-500/30 bg-red-500/5">
        <div class="text-center mb-6">
            <i class="fas fa-exclamation-triangle text-red-400 text-5xl mb-4"></i>
            <h2 class="text-xl font-bold text-white">确认删除</h2>
            <p class="text-slate-400 mt-2">确定要删除异常样品组 {{ group.group_number }} 吗？此操作不可撤销。</p>
        </div>

        <div class="bg-slate-900/50 rounded-lg p-4 mb-6">
            <p class="text-sm text-slate-500 mb-1">组编号</p>
            <p class="mono text-red-400">{{ group.group_number }}</p>
            <p class="text-sm text-slate-500 mt-3 mb-1">客户</p>
            <p class="text-white">{{ group.customer.customer_code }}</p>
            <p class="text-sm text-slate-500 mt-3 mb-1">样品数量</p>
            <p class="text-slate-300">{{ group.total_count }}</p>
        </div>

        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <a href="{% url 'abnormal:group_detail' group.pk %}" class="px-6 py-2 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800 transition-colors">
                取消
            </a>
            <button type="submit" class="px-6 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white transition-colors">
                <i class="fas fa-trash-alt mr-2"></i>确认删除
            </button>
        </form>
    </div>
</div>
{% endblock %}
