{% extends 'base.html' %}

{% block title %}添加测试记录 - {{ abnormal.sample_number }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto animate-slide-in">
    <!-- 页面标题 -->
    <div class="flex items-center gap-4 mb-6">
        <a href="{% url 'abnormal:abnormal_detail' abnormal.pk %}" class="text-slate-400 hover:text-white transition-colors">
            <i class="fas fa-arrow-left text-lg"></i>
        </a>
        <h2 class="text-xl font-semibold text-white">添加测试记录</h2>
    </div>

    <!-- 表单 -->
    <form method="post" class="glass rounded-xl border border-slate-700/50 overflow-hidden">
        {% csrf_token %}
        
        <!-- 基本信息 -->
        <div class="p-6 border-b border-slate-800">
            <h3 class="font-semibold text-white mb-4">异常样品</h3>
            <p class="text-sm text-slate-400">样品编号: <span class="text-white mono">{{ abnormal.sample_number }}</span></p>
        </div>

        <!-- 记录内容 -->
        <div class="p-6 border-b border-slate-800">
            <h3 class="font-semibold text-white mb-4">记录内容 <span class="text-red-400">*</span></h3>
            <textarea name="content" rows="6" placeholder="请输入测试记录内容..." 
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500/50 resize-none"
                required>{{ form.content.value|default:'' }}</textarea>
            {% if form.content.errors %}
            <p class="text-red-400 text-xs mt-1">{{ form.content.errors.0 }}</p>
            {% endif %}
        </div>

        <!-- 按钮 -->
        <div class="p-6 flex justify-end gap-3">
            <a href="{% url 'abnormal:abnormal_detail' abnormal.pk %}" class="px-6 py-2.5 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800 hover:text-white transition-all">
                取消
            </a>
            <button type="submit" class="px-6 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white transition-all shadow-lg shadow-red-600/20">
                保存记录
            </button>
        </div>
    </form>
</div>
{% endblock %}
