{% extends 'base.html' %}

{% block title %}删除物料 - SSD FAE业务管理系统{% endblock %}
{% block page_title %}删除物料{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto animate-slide-in">
    <div class="glass rounded-xl border border-slate-700/50 overflow-hidden p-8 text-center">
        <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i>
        </div>
        <h2 class="text-xl font-semibold text-white mb-2">确认删除此物料档案?</h2>
        <p class="text-slate-400 mb-2">物料编号：<span class="mono text-amber-400">{{ material.material_number }}</span></p>
        <p class="text-slate-400 mb-2">物料名称：<span class="text-white">{{ material.name }}</span></p>
        <p class="text-sm text-slate-500 mb-8">该物料的所有库存记录和流转记录也将被一并删除。</p>

        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <a href="{% url 'sample_shipment:material_detail' material.pk %}" class="px-6 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700">
                取消
            </a>
            <button type="submit" class="px-6 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white font-medium transition-colors flex items-center gap-2">
                <i class="fas fa-trash-alt"></i>
                <span>确认删除</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
